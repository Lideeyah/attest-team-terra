name: Build team05 runtime
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: team05-build
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.35.0
      - name: Read-only namespace diagnosis
        env:
          TEAM05_KUBECONFIG: ${{ secrets.TEAM05_KUBECONFIG }}
          GODEBUG: tlsmlkem=0,http2client=0
        run: |
          mkdir -p "$RUNNER_TEMP/attest"
          printf '%s' "$TEAM05_KUBECONFIG" > "$RUNNER_TEMP/attest/config"
          chmod 600 "$RUNNER_TEMP/attest/config"
          export KUBECONFIG="$RUNNER_TEMP/attest/config"
          python deploy/team05/diagnose.py
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ATTEST_API_MODE: live
      ATTEST_API_ORIGIN: http://api:8080
      ATTEST_DEV_TOOLS: '0'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - run: npm ci
      - run: npm ci --prefix backend
      - run: npm run build:production --prefix backend
      - run: npm run build
      - run: npm prune --omit=dev --prefix backend
      - run: node scripts/package-team05.mjs
      - name: Publish immutable runtime bundles
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "team05-${GITHUB_SHA}" .release/frontend.tar.gz .release/backend.tar.gz .release/SHA256SUMS --target "$GITHUB_SHA" --prerelease --title "team05 ${GITHUB_SHA}" --notes "Linux Node 24 runtime bundles for the team05 Kubernetes deployment."
  deploy:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      TEAM05_BOOTSTRAP_JSON: ${{ secrets.TEAM05_BOOTSTRAP_JSON }}
      GODEBUG: tlsmlkem=0,http2client=0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.35.0
      - name: Install deployment kubeconfig
        env:
          TEAM05_KUBECONFIG: ${{ secrets.TEAM05_KUBECONFIG }}
        run: |
          test -n "$TEAM05_KUBECONFIG"
          mkdir -p "$RUNNER_TEMP/attest"
          printf '%s' "$TEAM05_KUBECONFIG" > "$RUNNER_TEMP/attest/config"
          chmod 600 "$RUNNER_TEMP/attest/config"
          echo "KUBECONFIG=$RUNNER_TEMP/attest/config" >> "$GITHUB_ENV"
      - run: python deploy/team05/apply.py
