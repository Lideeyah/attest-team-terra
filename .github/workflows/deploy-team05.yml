name: Build team05 runtime
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: team05-build
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.35.0
      - name: Read-only namespace diagnosis
        env:
          TEAM05_KUBECONFIG: ${{ secrets.TEAM05_KUBECONFIG }}
          GODEBUG: tlsmlkem=0,http2client=0
        run: |
          mkdir -p "$RUNNER_TEMP/attest"
          printf '%s' "$TEAM05_KUBECONFIG" > "$RUNNER_TEMP/attest/config"
          chmod 600 "$RUNNER_TEMP/attest/config"
          export KUBECONFIG="$RUNNER_TEMP/attest/config"
          python deploy/team05/diagnose.py
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ATTEST_API_MODE: live
      ATTEST_API_ORIGIN: http://api:8080
      ATTEST_DEV_TOOLS: '0'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - name: Verify non-root archive extraction
        run: |
          test "$(id -u)" != 0
          extraction_test="$RUNNER_TEMP/attest-extraction-check"
          mkdir -p "$extraction_test/source" "$extraction_test/target"
          printf 'non-root extraction' > "$extraction_test/source/check.txt"
          tar -czf "$extraction_test/check.tar.gz" -C "$extraction_test/source" .
          sudo chown root:"$(id -g)" "$extraction_test/target"
          sudo chmod 2775 "$extraction_test/target"
          if tar -xzf "$extraction_test/check.tar.gz" --no-same-owner -C "$extraction_test/target" 2> "$extraction_test/expected-error.log"; then
            echo 'Expected the old extraction command to reject root-directory metadata changes'
            exit 1
          fi
          tar -xzf "$extraction_test/check.tar.gz" --strip-components=1 --no-same-owner --no-same-permissions --no-overwrite-dir -C "$extraction_test/target"
          test "$(cat "$extraction_test/target/check.txt")" = 'non-root extraction'
          echo 'Non-root extraction regression passed'
      - run: npm ci
      - run: npm ci --prefix backend
      - run: npm run build:production --prefix backend
      - run: npm run build
      - run: npm prune --omit=dev --prefix backend
      - run: node scripts/package-team05.mjs
      - name: Publish or reuse immutable runtime bundles
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="team05-${GITHUB_SHA}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json tagName,targetCommitish,assets > "$RUNNER_TEMP/team05-release.json" 2>/dev/null; then
            test "$(jq -r '.tagName' "$RUNNER_TEMP/team05-release.json")" = "$tag"
            test "$(jq -r '.targetCommitish' "$RUNNER_TEMP/team05-release.json")" = "$GITHUB_SHA"
            assets=$(jq -r '[.assets[].name] | sort | join(",")' "$RUNNER_TEMP/team05-release.json")
            test "$assets" = "SHA256SUMS,backend.tar.gz,frontend.tar.gz"
            echo "Verified and reusing immutable release $tag"
          else
            gh release create "$tag" .release/frontend.tar.gz .release/backend.tar.gz .release/SHA256SUMS --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "team05 ${GITHUB_SHA}" --notes "Linux Node 24 runtime bundles for the team05 Kubernetes deployment."
          fi
  deploy:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      TEAM05_BOOTSTRAP_JSON: ${{ secrets.TEAM05_BOOTSTRAP_JSON }}
      GODEBUG: tlsmlkem=0,http2client=0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.35.0
      - name: Install deployment kubeconfig
        env:
          TEAM05_KUBECONFIG: ${{ secrets.TEAM05_KUBECONFIG }}
        run: |
          test -n "$TEAM05_KUBECONFIG"
          mkdir -p "$RUNNER_TEMP/attest"
          printf '%s' "$TEAM05_KUBECONFIG" > "$RUNNER_TEMP/attest/config"
          chmod 600 "$RUNNER_TEMP/attest/config"
          echo "KUBECONFIG=$RUNNER_TEMP/attest/config" >> "$GITHUB_ENV"
      - run: python deploy/team05/apply.py
