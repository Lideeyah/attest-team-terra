<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Your payment · Attest</title>
<style>body{font:18px Georgia,serif;background:#f7f4eb;color:#181816;max-width:540px;margin:48px auto;padding:24px}small,label{font:12px monospace;letter-spacing:.05em;text-transform:uppercase;color:#5c5a55}h1{font:32px system-ui}button{background:#1e3a2e;color:#fff;border:0;padding:14px 18px;font:16px system-ui;margin:12px 0;cursor:pointer}button:disabled{opacity:.5}select,textarea{width:100%;padding:12px;border:1px solid #d8d4c5;background:#fdfcfa;font:16px system-ui;margin:8px 0 16px}section{padding:24px 0;border-top:1px solid #d8d4c5}#message{min-height:24px;color:#7a5038}#amount{font:36px monospace}textarea{min-height:100px}</style>
<small>Attest / payment receipt</small><h1>Your payment record</h1><p id="message" role="status" aria-live="polite">Loading your record…</p><p id="amount"></p><p id="date"></p><p id="state"></p><section><button id="confirm" disabled>I received this payment</button><p>Only confirm when the money has reached you.</p></section><section><h2>Report a problem</h2><form id="report"><label for="category">What happened?</label><select id="category"><option value="not_received">I never received this</option><option value="someone_else_collected">Someone else collected it</option><option value="wrong_amount">The amount was wrong</option></select><label for="detail">Tell us more (optional)</label><textarea id="detail" maxlength="4000"></textarea><button id="submit" disabled>Send report</button></form><p>Your report is recorded against this payment for review.</p></section>
<script type="module">
const $=id=>document.getElementById(id);const token=location.pathname.split('/').at(-1);const path='/api/receipt/'+encodeURIComponent(token);
async function request(suffix='',body){const response=await fetch(path+suffix,{method:body?'POST':'GET',headers:body?{'Content-Type':'application/json','Idempotency-Key':crypto.randomUUID()}:{},body:body?JSON.stringify(body):undefined});const data=await response.json();if(!response.ok)throw Error(data.error?.code||'Unavailable');return data.data;}
function error(e){const messages={TOKEN_EXPIRED:'This link has expired. Request a new link through your project contact.',ALREADY_CONFIRMED:'You have already confirmed this payment.',DISPUTE_ALREADY_OPEN:'Your report is already open.'};$('message').textContent=messages[e.message]||'We could not complete this request. Please try again.';}
try{const r=await request();$('amount').textContent='NGN '+r.amount;$('date').textContent=r.settledAt?'Paid '+new Date(r.settledAt).toLocaleDateString():'';$('state').textContent=r.confirmed?'Receipt confirmed.':'Bank record: '+r.state;$('confirm').disabled=r.confirmed||r.state!=='settled';$('submit').disabled=false;$('message').textContent='';}catch(e){error(e);}
$('confirm').onclick=async()=>{$('confirm').disabled=true;try{await request('/confirm',{});$('message').textContent='Thank you. Your confirmation has been recorded.';$('state').textContent='Receipt confirmed.';}catch(e){error(e);$('confirm').disabled=false;}};
$('report').onsubmit=async event=>{event.preventDefault();$('submit').disabled=true;try{await request('/dispute',{category:$('category').value,body:$('detail').value});$('message').textContent='Your report has been received and will be reviewed.';}catch(e){error(e);$('submit').disabled=false;}};
</script></html>
